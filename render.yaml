services:
  - type: web
    name: sm-nm-lms-platform
    env: node
    plan: starter # Starter plan is required for Persistent Disks on Render
    buildCommand: npm install && npm run install-all && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_KEY
        value: placeholder_change_me
      - key: CLIENT_SECRET
        value: placeholder_change_me
      - key: MONGODB_URI
        value: placeholder_change_me
    disk:
      name: courses-storage
      mountPath: /opt/render/project/src/backend/courses
      sizeGB: 10
